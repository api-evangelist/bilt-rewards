name: Bilt Rewards
description: 'Bilt Rewards (Bilt Technologies) is a fintech membership and loyalty program that lets
  renters and homeowners earn transferable points on rent and mortgage payments, with no fees, and
  redeem them for travel, everyday purchases, fitness, dining, or credit toward a future home down
  payment. Members also unlock benefits across 50,000+ neighborhood merchants and can use the co-branded
  Bilt Mastercard. Bilt operates regulated entities Bilt Payments LLC (money transmission) and Bilt
  Mortgages LLC (mortgage brokerage). The company is a consumer-facing app and card program; as of this
  enrichment pass it publishes no public developer API, developer portal, or API documentation.'
